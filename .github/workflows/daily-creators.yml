name: Daily Creators

on:
  schedule:
    - cron: '30 5 * * *'   # after Daily Videos, early in the D1 day
  workflow_dispatch:
    inputs:
      count:
        description: Pages to publish
        default: '25'

permissions:
  contents: write

concurrency:
  group: daily-creators
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
  DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
  D1_DATABASE_ID: 4f8937a1-9629-4c8b-a343-9cfe238cc319

jobs:
  creators:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Write and publish creator pages
        id: pilot
        run: node scripts/creator-autopilot.mjs --count ${{ github.event.inputs.count || '25' }}
      # A crash mid-run still leaves published rows in D1, so these run on failure too. Only a cancel skips them.
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.pilot.outputs.published != '0' && steps.pilot.outputs.published != '' }}
        run: npm run build
      # Commit before deploy: the snapshot is the fallback for every later build, so it must not depend on deploy working.
      - name: Commit snapshot and receipt
        if: ${{ !cancelled() }}
        run: |
          git config user.name "asmr-autopilot"
          git config user.email "autopilot@asmrregistry.com"
          git add state/creator-autopilot.json src/lib/creators-data.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: daily creator pages"
          git pull --rebase --autostash origin master
          git push
      - name: Deploy
        id: deploy
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npx wrangler deploy
      - name: Check new pages are live
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: |
          sleep 20
          for s in $(echo "${{ steps.pilot.outputs.slugs }}" | tr ',' ' '); do
            curl -s "https://asmrregistry.com/creators/$s/" | grep -q "at a glance" || { echo "::error::/creators/$s/ is not live"; exit 1; }
          done
          echo "all new creator pages live"
      - name: Tell Bing and Yandex
        if: ${{ !cancelled() && steps.deploy.outcome == 'success' }}
        run: node tools/indexnow-ping.mjs --creators "${{ steps.pilot.outputs.slugs }}" || echo "IndexNow ping failed, pages are still in the sitemap"
      - name: D1 read budget (yesterday)
        if: ${{ !cancelled() }}
        run: node tools/d1-read-alarm.mjs
