name: Creator Engine
# Daily: refresh creator files older than 25 days, build the next 100 creators, publish the creator-data branch
# (latest copy only), then build and deploy. YouTube quota capped at 6,000 units (shared with the cron worker).
on:
  schedule:
    # Off the :00/:30 rush (GitHub drops busy-minute schedules; 2026-11-16's 14:30 run never fired).
    # 19:41 is a backup that does nothing if the morning run already built today.
    - cron: '17 14 * * *'
    - cron: '41 19 * * *'
  workflow_dispatch:
    inputs:
      new:
        description: 'New creators to build'
        default: '100'
      over_budget_ok:
        description: 'Owner order only: add creators even if the shared Cloudflare request budget check fails'
        default: 'no'
concurrency:
  group: creator-engine
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Load creator data
        run: |
          git fetch --depth 1 origin creator-data && mkdir -p public/creator-data && git --work-tree=public/creator-data checkout origin/creator-data -- . || echo "no creator-data branch yet"
          git reset -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Shared 100K/day Worker limit with riverwaterlevels (main income site). Over budget: no new creators (refreshes and
      # fixes still ship), and the last step fails so GitHub emails the owner.
      - name: Check shared request budget
        id: budget
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node tools/request-budget.mjs && echo "over=no" >> "$GITHUB_OUTPUT" || echo "over=yes" >> "$GITHUB_OUTPUT"
      - name: Build creators
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          NEW=${{ github.event.inputs.new || '100' }}
          if [ "${{ steps.budget.outputs.over }}" = "yes" ] && [ "${{ github.event.inputs.over_budget_ok }}" != "yes" ]; then NEW=0; echo "over request budget: adding no new creators"; fi
          IDS=$(node tools/creator-daily.mjs --new $NEW ${{ github.event.schedule == '41 19 * * *' && '--backup' || '' }})
          [ -n "$IDS" ] && node tools/creator-build.mjs $IDS --budget 6000 || echo "nothing to build"
      - name: Publish creator-data branch
        run: |
          git config user.name "ASMR Registry"
          git config user.email "3124681+MwooVancity@users.noreply.github.com"
          sh tools/push-creator-data.sh
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: npm run build && npx wrangler deploy
      - name: Tell Bing about new pages
        if: success()
        run: node tools/indexnow-creators.mjs || true
      - name: Alert if the shared request budget is over
        if: steps.budget.outputs.over == 'yes' && github.event.inputs.over_budget_ok != 'yes'
        run: |
          echo "::error::Shared Cloudflare request budget is over (riverwaterlevels shares it). See the 'Check shared request budget' step."
          exit 1
